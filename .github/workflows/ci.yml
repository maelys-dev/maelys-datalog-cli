name: ci

# Created by maelys-release v0.62.2 (0.62.2) and owned by this repository: add
# jobs next to check; adopt keeps the socle line of check current.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    uses: maelys-dev/maelys-release/.github/workflows/check-product.yml@c411025b7d9131e693ed5c683b104d3204178e77 # v0.65.1
    with:
      product: maelys-datalog-cli
      sanitizer_command: make asan-cli PROFILE=SMALL && make asan-cli PROFILE=LARGE
